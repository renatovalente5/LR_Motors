# ============================================================================
# Publica o site da LR Motors no GitHub Pages.
#
# Corre sempre que alguma coisa muda em `main` — incluindo o que o cliente
# grava no backoffice — e também à mão, pelo botão "Run workflow".
#
# Nota: em Settings → Pages, a origem tem de estar em "GitHub Actions".
# Se ficar na opção antiga, o GitHub tenta processar o repositório com Jekyll
# e publica o código-fonte em vez do site gerado.
#
# A GUARDA DO CONTEÚDO (.github/guardas.mjs, com as regras de
# .github/regras.mjs — as mesmas do painel) corre duas vezes: logo ao início,
# para parar cedo e dizer porquê; e outra vez antes de gerar, a preparar a
# cópia dos dados que o gerador lê (as viaturas com problemas escondidas, as
# fotografias que não são da biblioteca fora). Essa cópia nunca entra no
# commit de volta: é feita DEPOIS dele. O job «avisar» abre a issue
# «Publicação parada» quando a publicação pára ou quando uma viatura muda no
# site por causa de um problema nos dados — o GitHub só avisa quem disparou a
# corrida, e as gravações do backoffice não avisam ninguém.
# ============================================================================
name: Publicar site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'PLANO.md'
      - '_fonte/**'
  workflow_dispatch:
    inputs:
      payload:
        # O Pages CMS envia sempre este input ao disparar do backoffice. Se não
        # estiver declarado, o GitHub recusa o dispatch com "unexpected input".
        description: 'Contexto do Pages CMS — deixar vazio se disparar à mão'
        required: false
        default: ''
      ensaiar_aviso:
        description: 'Abrir e fechar uma issue de ensaio, para confirmar que o aviso chega por email'
        type: boolean
        default: false

# NADA por omissão: cada job pede só o que usa, e o que não pede fica sem
# acesso. Até out 2026 os três herdavam daqui contents, pages e id-token em
# escrita — e o «construir», que corre os scripts do repositório e o Pillow,
# podia publicar no Pages sem passar pelo «publicar».
#
# As actions vão fixadas pelo COMMIT, com a etiqueta num comentário: uma
# etiqueta (v4) muda-se para outro código sem ninguém mexer aqui, um commit
# não. São os commits que as etiquetas davam a 1 out 2026; para subir de
# versão, trocar o commit e o comentário juntos.
permissions: {}

# Uma publicação de cada vez. Se o cliente gravar três anúncios seguidos, só o
# último build interessa — os anteriores são cancelados em vez de ficarem em fila.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      # `write` e não `read` por causa do commit de volta (o passo «Guardar…»):
      # as vendidas movidas e as fotografias preparadas. Mais nada.
      contents: write
    steps:
      # Sem deixar o token gravado no .git/config, que é onde todos os passos
      # seguintes — os scripts, o Pillow — o encontravam. Só o «Guardar…»
      # precisa dele, e recebe-o por env:.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # As regras de .github/regras.mjs, as mesmas do painel. Pára SÓ no que não
      # se pode publicar sem partir o site ou a lei: um JSON que não se lê, a
      # forma que o gerador precisa, os telefones e o WhatsApp, a morada do stand
      # e os dados legais da empresa. Uma viatura com problemas nunca pára a
      # publicação das outras: muda só na cópia que o gerador lê (passo
      # «Preparar a cópia…», mais abaixo). Corre ANTES de mexer em seja o que
      # for, para uma publicação que vai parar não deixar commits pelo caminho e
      # para dizer porquê — a arrumação das vendidas também pára com duas
      # viaturas no mesmo endereço, mas sem explicar. O relatório fica fora da
      # pasta do repositório, para não ser publicado.
      - name: Conferir o conteúdo
        run: node .github/guardas.mjs --relatorio-em "$RUNNER_TEMP/relatorio.json"

      # As viaturas marcadas como vendidas mudam-se para data/viaturas/vendidas/,
      # e as que deixarem de estar vendidas voltam para trás. Corre ANTES de
      # gerar, para o site já sair com os ficheiros do lado certo. Aqui só se
      # movem: quem grava é o passo «Guardar…», mais abaixo, para ir tudo num
      # commit só com as fotografias preparadas.
      - name: Arrumar as viaturas vendidas
        run: node scripts/arrumar-vendidas.mjs

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Uma versão fixa — a que esta publicação instalava a 1 out 2026 — e só a
      # roda já compilada. Um `pip install Pillow` solto trazia a versão do dia,
      # e, sem roda para esta máquina, compilava o pacote fonte, que corre o
      # código de quem o publicou. Subir de versão é mudar aqui, de propósito
      # (e a roda tem de existir para o Python de cima).
      - name: Instalar o Pillow
        run: |
          pip install --quiet --only-binary=:all: Pillow==12.3.0

      # O Pages CMS grava a foto exactamente como saiu do telemóvel — 3000 px e
      # vários MB. Aqui geram-se as versões de 480/960/1600 px em WebP que o
      # site serve. Os originais nunca chegam ao visitante.
      #
      # As geradas vão para assets/fotos/ e NÃO para o lado do original: em
      # assets/veiculos/ mora a biblioteca do backoffice, e enquanto as duas
      # coisas estiveram misturadas o cliente via quatro miniaturas da mesma
      # fotografia e escolhia à sorte. Este passo também apaga de assets/fotos/
      # o que já não tem fotografia na biblioteca.
      - name: Preparar as fotografias
        run: python3 scripts/otimizar-imagens.py --varrer

      # O cartão de partilha tem de mostrar a MESMA fotografia que a ficha
      # mostra como capa. A regra é simples de dizer e partiu-se duas vezes no
      # dia em que foi escrita, sempre em silêncio — nada falha, o WhatsApp é
      # que passa a mostrar outro carro. A bateria monta uma árvore de teste com
      # fotografias de cores sólidas e compara as duas. Corre em cinco segundos.
      - name: Bateria do cartão de partilha
        run: python3 scripts/testar-cartoes.py

      # A biblioteca só pode ter fotografias. Se uma variante lá voltar a
      # aparecer — por engano num script, ou carregada à mão —, o backoffice
      # volta a mostrar a mesma fotografia várias vezes, que foi a queixa de
      # 11/9/2026. Falha aqui, antes de o cliente dar com isso.
      #
      # Só os sufixos de largura. O `og.jpg` esteve nesta lista durante umas
      # horas e saiu: o cartão de partilha mudou-se para assets/fotos/partilha/,
      # portanto já nada o escreve aqui, e uma fotografia que o cliente calhasse
      # a ter com esse nome deixava de poder ser publicada — uma publicação
      # bloqueada por um nome de ficheiro, sem nada de mal a acontecer.
      - name: Confirmar que a biblioteca não tem ficheiros gerados
        run: |
          intrusos=$(find assets/veiculos -type f \( -name '*-480.webp' -o -name '*-960.webp' \
                      -o -name '*-1600.webp' \) | head -20)
          if [ -n "$intrusos" ]; then
            echo "há variantes geradas dentro de assets/veiculos (a biblioteca do backoffice):"
            echo "$intrusos"
            echo "o sítio delas é assets/fotos/ — ver scripts/otimizar-imagens.py"
            exit 1
          fi
          echo "biblioteca só com fotografias: $(find assets/veiculos -type f | wc -l | tr -d ' ') ficheiros"

      # GRAVA O QUE ESTA PUBLICAÇÃO PRODUZIU: as viaturas que mudaram de pasta e
      # as variantes das fotografias.
      #
      # As variantes eram o problema maior e não se via: o script é incremental,
      # mas o que ele gerava ficava só na máquina da Action e ia fora no fim. Na
      # publicação de 1/9/2026 isso deu «variantes novas: 241 · já existentes:
      # 25» e 197 dos 240 segundos da publicação inteira — a repetir-se em cada
      # gravação do cliente, e a piorar a cada fotografia que ele carregasse.
      # Guardadas, cada fotografia é preparada UMA vez e a publicação volta a
      # demorar menos de um minuto. Isso não é só gastar menos: o cliente gravou,
      # foi ver o site, ainda lá estava o antigo, e concluiu que o site estava
      # avariado — o que aconteceu mesmo, a 1/9.
      #
      # `[skip ci]` porque um push com o GITHUB_TOKEN não dispara workflows de
      # qualquer maneira; fica escrito para quem ler o histórico perceber que a
      # gravação não é para publicar nada.
      #
      # Se a gravação falhar, AVISA e segue. Falha quando o cliente grava outra
      # viatura enquanto isto corre: o `main` mexeu-se e o push é recusado. Nesse
      # caso o site que vai para o ar já está certo — os ficheiros foram movidos
      # e as fotografias preparadas aqui — e o que fica por gravar repete-se na
      # publicação seguinte. Deitar a publicação abaixo por causa disso seria
      # trocar um site no ar por um repositório arrumado.
      #
      # O token chega SÓ a este passo (o checkout já não o deixa gravado), e o
      # git só o dá ao github.com: vai num credential.helper que vive no
      # ambiente deste passo (GIT_CONFIG_*), e nada fica no .git/config. O
      # primeiro valor, vazio, põe de lado qualquer outro helper que lá
      # estivesse.
      - name: Guardar as mudanças de pasta e as fotografias preparadas
        env:
          TOKEN_DO_PUSH: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain data/viaturas assets/veiculos assets/fotos)" ]; then
            echo "nada de novo para guardar"; exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/viaturas assets/veiculos assets/fotos
          n=$(git diff --cached --numstat | wc -l | tr -d ' ')
          git commit -m "Arrumar vendidas e guardar fotografias preparadas ($n ficheiros) [skip ci]"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=credential.https://github.com.helper GIT_CONFIG_VALUE_0=
          export GIT_CONFIG_KEY_1=credential.https://github.com.helper
          export GIT_CONFIG_VALUE_1='!f() { if [ "$1" = get ]; then echo username=x-access-token; echo "password=$TOKEN_DO_PUSH"; fi; }; f'
          git pull --rebase --quiet origin main || true
          git push origin HEAD:main || echo "AVISO: não deu para gravar; o site vai na mesma e a próxima publicação repete"

      # A CÓPIA DOS DADOS QUE O GERADOR LÊ: as regras outra vez (o «Guardar…»
      # pode ter trazido commits novos), e as viaturas com problemas mudadas SÓ
      # nesta máquina — sem marca ou sem modelo ficam escondidas, uma fotografia
      # que não é da biblioteca sai da lista. Sem nada a neutralizar, os
      # ficheiros nem se tocam.
      #
      # TEM DE FICAR DEPOIS DO «Guardar…»: esse passo faz `git add -A
      # data/viaturas` e commit de volta para o repositório, e a cópia
      # neutralizada não pode ir lá parar — o dono deixava de ver a viatura no
      # backoffice como a escreveu. Nenhum passo depois deste grava no
      # repositório (o .github/test-guardas.mjs confere as duas coisas).
      - name: Preparar a cópia que o gerador lê
        run: node .github/guardas.mjs --neutralizar . --relatorio-em "$RUNNER_TEMP/relatorio.json"

      # O site tem domínio próprio, lrmotorsautomoveis.pt, e um domínio próprio
      # serve na RAIZ. Enquanto isto esteve em `/LR_Motors`, tudo o que o HTML
      # pedia — folha de estilo, JavaScript, fotografias, ligações entre páginas
      # — apontava para `/LR_Motors/...`, que no domínio dá 404: o site esteve
      # no ar sem estilos e sem navegação. Se um dia o domínio cair, o que muda
      # aqui é BASE para /LR_Motors e SITE para o endereço github.io.
      - name: Gerar o site
        run: node scripts/gerar.mjs
        env:
          BASE: ''
          SITE: https://lrmotorsautomoveis.pt

      # Rede de segurança para o que partiu o site: se o HTML voltar a pedir
      # caminhos com /LR_Motors/, a publicação falha aqui em vez de ir para o ar.
      - name: Confirmar que os caminhos servem o domínio
        run: |
          test -f _site/CNAME || { echo "falta o CNAME no que vai ser publicado"; exit 1; }
          if grep -rq '"/LR_Motors/' _site --include='*.html'; then
            echo "há caminhos /LR_Motors/ no HTML — no domínio próprio dão 404"; exit 1
          fi
          echo "caminhos e CNAME conferidos"

      # Contar pastas deixou de provar alguma coisa: as viaturas vendidas também
      # deixam uma pasta lá, com um stub de reencaminhamento em vez de uma
      # página. Sem separar as duas coisas, esta guarda passava com o stand todo
      # vendido e ZERO páginas a sério — a dizer "16 páginas de viatura geradas".
      - name: Verificar o resultado
        run: |
          test -f _site/index.html || { echo "falta o index.html"; exit 1; }
          test -f _site/sitemap.xml || { echo "falta o sitemap"; exit 1; }
          total=$(find _site/viaturas -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          stubs=$(grep -rl 'http-equiv="refresh"' _site/viaturas --include='index.html' | wc -l | tr -d ' ')
          reais=$((total - stubs))
          echo "páginas de viatura: $reais a sério, $stubs reencaminhamentos de vendidas"
          test "$reais" -gt 0 || { echo "nenhuma viatura à venda tem página"; exit 1; }
          # Um stub tem noindex implícito pelo refresh; pedir ao Google que o
          # rastreie pelo sitemap era mandá-lo a uma página que o manda embora.
          for s in $(grep -rl 'http-equiv="refresh"' _site/viaturas --include='index.html' | awk -F/ '{print $3}'); do
            if grep -q "/viaturas/$s/" _site/sitemap.xml; then
              echo "a vendida $s está no sitemap e não devia"; exit 1
            fi
          done
          echo "sitemap sem vendidas conferido"

      # O `og:image` é a fotografia que o WhatsApp mostra quando o stand
      # partilha um anúncio, e é assim que este negócio vende. Sai de um
      # ficheiro que OUTRO script escreve (o cartão de partilha, em
      # assets/fotos/partilha/), portanto é fácil de partir sem ninguém dar por
      # isso: basta um cartão apagado pela limpeza das órfãs, ou um retoque na
      # regra que decide o que é copiado para _site. Sem imagem, a partilha sai
      # sem pré-visualização nenhuma — e não há erro em lado nenhum a dizê-lo.
      - name: Confirmar que as imagens de partilha existem
        run: |
          python3 - <<'PY'
          import os, re, sys, urllib.parse
          faltam = []
          for raiz, _, ficheiros in os.walk('_site'):
              for nome in ficheiros:
                  if not nome.endswith('.html'):
                      continue
                  caminho = os.path.join(raiz, nome)
                  html = open(caminho, encoding='utf-8').read()
                  for m in re.finditer(r'property="og:image" content="([^"]+)"', html):
                      rel = urllib.parse.unquote(urllib.parse.urlparse(m.group(1)).path).lstrip('/')
                      if not os.path.isfile(os.path.join('_site', rel)):
                          faltam.append(f'{caminho}: {m.group(1)}')
          if faltam:
              print('há páginas a apontar para uma imagem de partilha que não existe:')
              print('\n'.join(faltam[:20]))
              sys.exit(1)
          print('imagens de partilha conferidas')
          PY

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      # Também quando a guarda parou: é o que o job «avisar» põe na issue.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: relatorio
          path: ${{ runner.temp }}/relatorio.json
          if-no-files-found: ignore
          retention-days: 7

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    # O que o deploy-pages pede (o README dele), e só a este job.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # ---------------------------------------------------------------------------
  # Quem fica a saber. Sem checkout; só pode mexer em issues.
  #
  # Uma corrida CANCELADA não avisa ninguém: com cancel-in-progress foi
  # substituída por outra, mais recente (o dono gravou outra vez), e é essa que
  # diz como correu. `always()` correria também nas canceladas, e abria a issue
  # a cada gravação seguida.
  # ---------------------------------------------------------------------------
  avisar:
    needs: [construir, publicar]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: relatorio
          path: relatorio

      # Os valores do GitHub entram por env:, nunca por ${{ }} dentro do run:.
      # O texto da issue vai por ficheiro, e as mensagens da guarda dentro de um
      # bloco ~~~~ (sem formatação nem menções @): o repositório é público.
      # continue-on-error: um aviso que não sai não é uma publicação falhada.
      - name: Abrir, comentar ou fechar a issue «Publicação parada»
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONSTRUIR: ${{ needs.construir.result }}
          PUBLICAR: ${{ needs.publicar.result }}
          ENSAIO: ${{ inputs.ensaiar_aviso }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          QUEM: ${{ github.actor }}
        run: |
          TITULO='Publicação parada'
          REL=relatorio/relatorio.json
          # Rede para o `if:` do job: cancelada, não se diz nada.
          case " $CONSTRUIR $PUBLICAR " in
            *" cancelled "*) echo "corrida cancelada (outra mais recente tomou o lugar): não se avisa ninguém"; exit 0 ;;
          esac
          FALHOU=false
          if [ "$CONSTRUIR" != success ] || [ "$PUBLICAR" != success ]; then FALHOU=true; fi
          MUDARAM=0
          if [ -f "$REL" ]; then MUDARAM=$(jq '(.neutralizados // []) | length' "$REL" 2>/dev/null || echo 0); fi

          {
            if [ "$FALHOU" = true ]; then
              echo "A publicação do site **parou**: o site continua como estava antes deste commit."
            else
              echo "O site foi publicado, mas **$MUDARAM viatura(s) mudaram no site** (escondidas, ou com fotografias que não aparecem) por terem dados com problemas. O ficheiro do repositório não mudou: basta corrigir e gravar outra vez."
            fi
            echo
            echo "- Corrida: $CORRIDA"
            echo "- Commit: $COMMIT (de $QUEM)"
            echo "- Construir: $CONSTRUIR · Publicar: $PUBLICAR"
            GUARDA=''
            if [ -f "$REL" ]; then
              GUARDA=$(jq -r '
                def linha: gsub("[[:cntrl:]]+"; " ") | .[0:600];
                ((.problemas // []) | map(select(.classe == "bloqueia")) | .[] | ("- PÁRA · " + (.ecra // "") + " — " + (.mensagem // "")) | linha),
                ((.neutralizados // []) | .[] | ("- NO SITE · " + (.nome // .slug // "?") + ": " + (.descricao // "") + " — " + ((.motivos // []) | join(" "))) | linha)
              ' "$REL" | sed -n '1,80p')
            fi
            if [ -n "$GUARDA" ]; then
              echo
              echo "O que a guarda encontrou (a lista inteira está no resumo da corrida):"
              echo
              echo '~~~~'
              printf '%s\n' "$GUARDA"
              echo '~~~~'
            fi
          } > aviso.md

          # A issue do bot encontra-se pelo título E pelo autor: o repositório é
          # público, e qualquer pessoa pode abrir uma com o mesmo título — o bot
          # comentava-a (o autor recebia o aviso) ou fechava-a. A que o bot abre
          # fica trancada (só quem tem acesso ao repositório comenta).
          ABERTA=$(gh issue list --state open --limit 100 --json number,title,author \
            | jq -r --arg t "$TITULO" '[.[] | select(.title == $t and ((.author.login // "") as $l | $l == "app/github-actions" or $l == "github-actions" or $l == "github-actions[bot]")) | .number] | first // empty')

          # Um erro do gh (um 502, o limite da API) não pára este passo: fica um
          # aviso na corrida, e a publicação continua a contar como feita.
          sem_gh() { echo "::warning title=Aviso da publicação::Não consegui $1 a issue «$TITULO» (o site não muda com isto)."; }

          if [ "$FALHOU" = true ] || [ "$MUDARAM" -gt 0 ]; then
            if [ -n "$ABERTA" ]; then gh issue comment "$ABERTA" --body-file aviso.md || sem_gh comentar
            elif URL=$(gh issue create --title "$TITULO" --body-file aviso.md); then
              gh issue lock "${URL##*/}" || sem_gh trancar
            else sem_gh abrir; fi
          elif [ -n "$ABERTA" ]; then
            gh issue close "$ABERTA" --comment "Voltou a publicar sem problemas (commit $COMMIT). $CORRIDA" || sem_gh fechar
          fi

          # Ensaio (workflow_dispatch com ensaiar_aviso): abre e fecha uma issue
          # à parte, para o Renato confirmar que os DOIS emails chegam.
          if [ "${ENSAIO:-}" = true ]; then
            printf 'Ensaio do aviso «%s»: se este email chegou, os avisos das publicações paradas também chegam.\n\n- Corrida: %s\n' "$TITULO" "$CORRIDA" > ensaio.md
            if URL=$(gh issue create --title "$TITULO — ensaio do aviso" --body-file ensaio.md); then
              gh issue close "${URL##*/}" --comment "Ensaio terminado: esta issue fecha-se sozinha. Chegaram os dois emails (abrir e fechar)? Se não, Watch → Custom → Issues no repositório, e repetir." || sem_gh fechar
            else sem_gh abrir; fi
          fi
