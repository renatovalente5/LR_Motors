# ============================================================================
# Backoffice da LR Motors — configuração do Pages CMS (pagescms.org)
#
# O cliente entra em app.pagescms.org com um link enviado por email. Não precisa
# de conta no GitHub e não consegue mexer neste ficheiro — só no conteúdo.
#
# Cada alteração é gravada no repositório e o site volta a ser publicado
# automaticamente em 1 a 3 minutos.
#
# ----------------------------------------------------------------------------
# Botão de publicar, para o cliente ver e forçar o build sem sair do backoffice.
# O Pages CMS dispara o workflow por `workflow_dispatch` e envia um input
# chamado `payload` — o workflow tem de o declarar, senão o GitHub recusa o
# dispatch por input inesperado.
# ============================================================================
actions:
  - name: publicar
    label: Publicar site agora
    workflow: publicar.yml
    ref: current
    confirm:
      title: Publicar o site?
      message: >-
        O site vai ser reconstruído com as alterações já gravadas.
        Demora 1 a 3 minutos. Normalmente não é preciso — cada gravação já
        publica sozinha. Use isto se achar que ficou algo por actualizar.
      button: Publicar

# `output` é igual a `input` de propósito. Com a barra inicial (`/assets/...`) o
# Pages CMS grava os caminhos das fotos numa forma diferente da que está nos
# ficheiros, e a primeira gravação de cada viatura reescrevia a lista de fotos
# toda. O site aguentava — o gerador limpa a barra —, mas ficava um histórico
# cheio de alterações sem valor. Aconteceu a sério no Nissan Patrol (00b1c17).
media:
  input: assets/veiculos
  output: assets/veiculos

content:
  # --------------------------------------------------------------- viaturas
  - name: viaturas
    label: Viaturas
    type: collection
    path: data/viaturas
    # O NOME DO FICHEIRO É O ENDEREÇO DA PÁGINA, e sai sozinho do que o cliente
    # escreve. Havia aqui um campo «Endereço da página (referência)» que ele
    # tinha de preencher à mão, com um parágrafo a avisar que só levava
    # minúsculas e hífens e que nunca mais podia ser mudado — o campo mais
    # técnico do backoffice todo, num formulário para o dono de um stand.
    #
    # `field: false` esconde-o por completo: ele nunca vê nem decide o nome.
    # Isto é seguro porque o Pages CMS NÃO renomeia ficheiros já criados (só
    # gera o nome ao criar), por isso corrigir uma gralha na marca não muda o
    # endereço de uma página já partilhada; e porque se dois carros derem o
    # mesmo nome ele acrescenta -1, -2 em vez de escrever por cima.
    filename:
      template: '{fields.marca}-{fields.modelo}-{fields.versao}.json'
      field: false
    format: json
    # As vendidas vivem em data/viaturas/vendidas/, que é uma subpasta desta.
    # Sem isto apareciam aqui dentro também, e a pasta separada não servia de
    # nada. É SUBPASTA e não pasta irmã porque o Pages CMS só deixa renomear um
    # ficheiro para dentro do caminho da própria colecção.
    subfolders: false
    view:
      # O `slug` na tabela é a referência da viatura: é o que está no endereço
      # da página e o nome do próprio ficheiro, portanto é por ele que se
      # identifica uma viatura sem ambiguidade — há dois Renault e dois Peugeot
      # em stock, e «marca + modelo» não chega para os distinguir de relance.
      # `versao` na lista porque «marca + modelo» não chega: há duas Renault
      # Captur e dois Peugeot em stock, e sem a versão são indistinguíveis.
      # O título de cada linha é o MODELO, que é o que distingue de relance —
      # com a marca a repetir-se, «Renault» três vezes não orienta ninguém.
      fields: [modelo, marca, versao, preco, estado, publicado]
      primary: modelo
      sort: [ordem, preco, ano]
    # `&campos` / `*campos` é uma âncora de YAML: a lista é escrita UMA vez e a
    # pasta das Vendidas, mais abaixo, reutiliza-a. Não é para poupar linhas — é
    # porque o Pages CMS APAGA do ficheiro qualquer campo que a colecção não
    # declare. Duas listas escritas à mão divergiriam ao primeiro campo novo, e
    # gravar uma vendida deitava fora o que a outra lista tivesse a mais.
    # (Confirmado que o parser deles, o pacote `yaml`, resolve âncoras.)
    fields: &campos
      # ORDEM DOS CAMPOS. O Pages CMS mostra-os por esta ordem, e é a ordem por
      # que se pensa num carro: o que é, quanto custa, as fotos, a ficha, o que
      # a lei obriga, os textos, e só no fim as opções de publicação. O `slug`
      # ficou para último por ser o único campo técnico do formulário.

      # ─────────── que carro é
      - name: marca
        label: Marca
        type: string
        required: true
        description: 'Como se escreve normalmente: BMW, Mercedes-Benz, Citroën.'
      - name: modelo
        label: Modelo
        type: string
        required: true
        description: 'Só o modelo, sem a versão: Captur, i4, Classe E.'
      - name: versao
        label: Versão
        type: string
        description: 'O resto do nome: 0.9 TCE Expression.'
      - name: tipo
        label: Tipo de veículo
        type: select
        default: carro
        # A chave de cada opção é `name`, não `value` — está assim documentado.
        # Estava `value`, o que arrisca gravar o estado errado quando o cliente
        # escolhe da lista. Nunca chegou a acontecer porque os valores dos dados
        # vieram sempre do gerador, mas era uma bomba com o pino tirado.
        options:
          values:
            - { name: carro, label: Carro }
            - { name: mota, label: Mota }
            - { name: off-road, label: 'Off-road / todo-o-terreno' }
      - name: carrocaria
        label: Carroçaria
        type: string
        description: 'Citadino, SUV, Berlina, Carrinha, Cabrio, Coupé…'

      # ─────────── preço
      - name: preco
        label: Preço
        type: number
        description: 'Só o número, sem € nem pontos: 18990. Tem de ser o preço final, com impostos. Vazio mostra "Sob consulta".'

      # ─────────── disponibilidade (o que mais se mexe no dia-a-dia)
      - name: publicado
        label: Publicado no site
        type: boolean
        default: true
        description: 'Desligue para esconder a viatura sem perder o anúncio.'
      # UMA LISTA SÓ, e não um interruptor mais uma lista. A reserva já foi um
      # interruptor à parte do estado, o que permitia dizer que um carro estava
      # reservado E vendido ao mesmo tempo — havia uma regra escrita no gerador
      # a decidir qual mandava. Com quatro valores numa lista, a contradição
      # deixou de se poder exprimir.
      #
      # Custa um toque a mais para reservar do que custava o interruptor. Vale:
      # são estados que se excluem, e é assim que o cliente pensa neles.
      - name: estado
        label: Estado
        type: select
        default: disponivel
        description: 'Reservado e Brevemente ficam na lista, com etiqueta na fotografia. Vendido passa a viatura para "Já vendidas" e move o ficheiro para a pasta Vendidas.'
        options:
          values:
            - { name: disponivel, label: 'À venda' }
            - { name: reservado, label: 'Reservado (fica no site, com etiqueta)' }
            - { name: brevemente, label: 'Brevemente (ainda não chegou ao stand)' }
            - { name: vendido, label: 'Vendido (passa para a pasta Vendidas)' }
      # ─────────── fotografias
      - name: fotos
        label: Fotografias
        type: image
        options:
          # 50 fotografias por viatura. Não é limite nosso por gosto: o campo do
          # Pages CMS exige um `max`, portanto algum número tem de lá estar, e
          # 50 é folgado — o Standvirtual dá cinco por anúncio e a viatura com
          # mais fotos que este stand teve tinha doze.
          multiple:
            max: 50
        description: 'A primeira é a que aparece na listagem e nas partilhas: o carro inteiro, de três quartos, sem pessoas. Arraste para reordenar. Se alguma falhar a carregar é grande de mais — reduza-a em lrmotorsautomoveis.pt/fotos/. Não apague fotografias na biblioteca; para tirar uma do anúncio, remova-a aqui.'

      # ─────────── ficha técnica
      - name: ano
        label: Ano
        type: number
        description: 'Ano da primeira matrícula, como vem no livrete.'
      # O mês é campo próprio e não parte de uma data escrita à mão: escolhido
      # de uma lista não há enganos de formato. Substituiu o antigo campo «Data
      # da primeira matrícula», que guardava a mesma coisa que este mais o ano e
      # podia acabar a dizer um ano diferente do campo ao lado.
      #
      # Os rótulos são «Ano» e «Mês», curtos, por decisão do cliente. Estiveram
      # «Ano da primeira matrícula» e «Mês da primeira matrícula»; o que a lei
      # obriga a prestar está dito na ajuda, que é onde se lê sem encher o
      # formulário.
      - name: mes
        label: Mês
        type: select
        description: 'Mês da primeira matrícula. Vazio mostra só o ano.'
        options:
          values:
            - { name: Janeiro, label: Janeiro }
            - { name: Fevereiro, label: Fevereiro }
            - { name: Março, label: Março }
            - { name: Abril, label: Abril }
            - { name: Maio, label: Maio }
            - { name: Junho, label: Junho }
            - { name: Julho, label: Julho }
            - { name: Agosto, label: Agosto }
            - { name: Setembro, label: Setembro }
            - { name: Outubro, label: Outubro }
            - { name: Novembro, label: Novembro }
            - { name: Dezembro, label: Dezembro }
      - name: km
        label: Quilómetros
        type: number
        description: 'Só o número: 94000.'
      - name: combustivel
        label: Combustível
        type: select
        options:
          values: [Gasolina, Diesel, Elétrico, Híbrido, Híbrido Plug-in, GPL]
      - name: caixa
        label: Caixa
        type: select
        options:
          values: [Manual, Automática]
      - name: potencia
        label: Potência (cv)
        type: number
      - name: cilindrada
        label: Cilindrada (cm³)
        type: number
        description: 'Vazio nos eléctricos.'
      - name: cor
        label: Cor
        type: string
      - name: lugares
        label: Lugares
        type: number
      - name: portas
        label: Portas
        type: number
      - name: origem
        label: Origem
        type: select
        options:
          values: [Nacional, Importado]

      # ─────────── o que a lei obriga a dizer
      - name: matricula
        label: Matrícula
        type: string
        description: 'Obrigatória por lei na venda de usados. Exemplo: AA-00-BB.'
      - name: ano_construcao
        label: Ano de construção
        type: number
        description: 'Obrigatório por lei, e só quando é diferente do ano da matrícula.'
      - name: registos_anteriores
        label: Donos anteriores
        type: number
        description: 'Obrigatório por lei. Sem contar o stand.'
      - name: garantia
        label: Garantia
        type: string
        description: 'Como quer que apareça: "18 meses". Vazio mostra só a garantia legal.'

      # ─────────── o que traz, e o que se diz dele
      - name: equipamento
        label: Equipamento
        type: string
        list: true
        description: 'Um por linha, curto: Câmara de marcha-atrás. Não repita a ficha técnica.'
      - name: descricao
        label: Descrição
        type: text
        description: 'Duas ou três frases sobre o que a ficha não diz: estado, histórico. Defeitos conhecidos escrevem-se aqui — é o que protege o stand. Para negrito, escreva **assim**.'

      # ─────────── onde aparece na página inicial
      - name: destaque
        label: Destaque na página inicial
        type: boolean
        default: false
        description: 'Aparecem no carrossel do topo. Quatro a seis fica bem.'
      - name: ordem
        label: Ordem
        type: number
        default: 50
        description: 'Número mais baixo aparece primeiro. 50 se for indiferente.'


  # --------------------------------------------------------------- vendidas
  # As viaturas vendidas, fora do caminho de quem trata do stock do dia-a-dia.
  # NÃO se põe aqui uma viatura à mão: põe-se o Estado em "Vendido" na pasta das
  # Viaturas, e a publicação move o ficheiro para cá. Mover é feito pela Action
  # porque o Pages CMS não deixa arrastar ficheiros entre pastas.
  #
  # Os campos são os MESMOS da outra pasta, pela âncora acima. O preço e a
  # descrição continuam declarados e continuam no formulário, mesmo já não
  # aparecendo no site: se fossem retirados daqui, a primeira gravação de uma
  # vendida apagava-os do ficheiro, e desfazer uma venda por engano deixava a
  # viatura sem preço para sempre.
  - name: vendidas
    label: Vendidas
    type: collection
    path: data/viaturas/vendidas
    filename:
      template: '{fields.marca}-{fields.modelo}-{fields.versao}.json'
      field: false
    format: json
    # Sem isto, o backoffice mostra aqui o botão de criar subpastas. Uma viatura
    # arrastada para uma subpasta desaparecia do site em silêncio: o gerador e a
    # arrumação só lêem o primeiro nível desta pasta, e ninguém dava pela falta
    # até alguém reparar que o carro sumiu do histórico.
    subfolders: false
    view:
      fields: [modelo, marca, versao, ano]
      primary: modelo
      sort: [ordem, ano]
    fields: *campos

  # ------------------------------------------------------------- definições
  - name: definicoes
    label: Dados do stand
    type: file
    path: data/definicoes.json
    format: json
    fields:
      - name: contactos
        label: Contactos
        type: object
        description: >-
          Aparecem no cabeçalho, no rodapé, na página de Contactos e nos botões
          de ligar de todas as páginas. Mudar aqui muda em todo o lado.
        fields:
          - { name: telefone_1, label: Telefone 1 (só dígitos), type: string }
          - { name: telefone_1_texto, label: Telefone 1 (como aparece), type: string }
          - { name: telefone_2, label: Telefone 2 (só dígitos), type: string }
          - { name: telefone_2_texto, label: Telefone 2 (como aparece), type: string }
          - { name: whatsapp, label: WhatsApp (351 + número), type: string }
          - { name: email, label: Email, type: string }
      - name: stand
        label: Morada do stand
        type: object
        fields:
          - { name: morada, label: Rua, type: string }
          - { name: codigo_postal, label: Código postal, type: string }
          - { name: localidade, label: Localidade, type: string }
          - { name: distrito, label: Distrito, type: string }
          - { name: pais, label: País, type: string }
          - { name: mapa, label: Link do Google Maps, type: string }
          - { name: latitude, label: Latitude, type: number }
          - { name: longitude, label: Longitude, type: number }
      - name: horario
        label: Horário
        type: object
        description: >-
          O site marca sozinho a linha do dia de hoje. Escreva os dias como quer
          que apareçam — «Segunda a sexta», «Sábado», «Domingo».
        list: true
        fields:
          - { name: dias, label: Dias, type: string }
          - { name: horas, label: Horas, type: string }
      - name: redes
        label: Redes sociais
        type: object
        fields:
          - { name: instagram, label: Instagram, type: string }
          - { name: facebook, label: Facebook, type: string }
          - { name: tiktok, label: TikTok, type: string }
      - name: textos
        label: Textos do site
        type: object
        description: >-
          As frases grandes do site. Alterações aqui aparecem na página inicial
          e no «Sobre nós» assim que gravar.
        fields:
          - { name: reclamo, label: Frase da marca, type: string }
          - { name: hero_titulo, label: Título da página inicial, type: string }
          - { name: hero_texto, label: Texto da página inicial, type: text }
          - { name: sobre_titulo, label: Título do "Sobre nós", type: string }
          - { name: sobre_texto, label: Texto do "Sobre nós", type: text }
          - { name: locais, label: Onde estamos (texto livre), type: string }
          - name: aviso_visita
            label: Aviso sobre visitas noutro local
            type: string
            description: >-
              Uma frase que aparece na secção "Venha ver ao vivo" da página
              inicial, na página de Contactos e na ficha de cada viatura, junto
              aos botões. Exemplo: "Com marcação, também mostramos a viatura em
              **Vila do Conde**." Deixe vazio para não aparecer em lado nenhum.
              O que puser entre dois asteriscos aparece a negrito.
      - name: opcoes
        label: Opções
        type: object
        fields:
          - name: mostrar_vendidos
            label: Mostrar secção "Já vendidas" na listagem
            type: boolean
      - name: empresa
        label: Dados legais da empresa
        type: object
        description: >-
          Aparecem no rodapé por imposição legal (art. 171.º do Código das
          Sociedades Comerciais). Altere só se algum destes dados mudar.
        fields:
          - { name: nome_comercial, label: Nome comercial, type: string }
          - { name: denominacao_social, label: Denominação social, type: string }
          - { name: nif, label: NIF, type: string }
          - { name: capital_social, label: Capital social, type: string }
          - { name: forma_juridica, label: Forma jurídica, type: string }
          - { name: cae, label: CAE, type: string }
      - name: sede_social
        label: Sede social
        type: object
        fields:
          - { name: morada, label: Rua, type: string }
          - { name: codigo_postal, label: Código postal, type: string }
          - { name: localidade, label: Localidade, type: string }
          - { name: distrito, label: Distrito, type: string }
